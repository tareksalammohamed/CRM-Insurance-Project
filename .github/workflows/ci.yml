name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Help coverage
        run: npm run check:help

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm test

      - name: Closing period SQL regression
        run: npm run check:closing-sql

      - name: TypeScript
        run: npm run typecheck

      - name: Install print-test browser
        run: npx playwright install --with-deps chromium

      - name: PDF print regression
        run: npm run check:print

      - name: Production build
        run: npm run build
