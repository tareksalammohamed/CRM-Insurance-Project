<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/insurance-crm-icon-96.png" />
    <link rel="icon" type="image/x-icon" href="/insurance-crm-favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/insurance-crm-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/insurance-crm-icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/insurance-crm-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="نظام CRM لإدارة التأمينات - نظام متكامل لإدارة دورة العمل من إضافة العميل وحتى التحصيل والتقارير" />
    <title>قناة السويس لتأمينات الحياة</title>
    <!-- تحميل الخط بشكل مبكر وغير حاجب لعرض الصفحة (بدلاً من @import داخل CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0F172A">

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('insurance-crm-theme');
          var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (_) {}
      }());
    </script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
